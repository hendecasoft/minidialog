run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }
spongegradle = { id = "org.spongepowered.gradle.plugin", version.ref = "spongegradle" }
ttdev = { id = "io.github.wasabithumb.ttdev", version.ref = "ttdev" }

[versions]
jspecify = "1.0.1"
annotations = "26.1.0"
indra = "4.1.0"
adventure = "5.2.0"
adventure-platform = "7.2.0"
paper = "26.1.2.build.74-stable"
velocity = "4.3.0"
shadow = "9.6.1"
resource-factory = "1.4.0"
run-task = "3.1.0"
packetevents = "2.14.0"
sponge = "19.0.0-SNAPSHOT"
spongegradle = "2.5.1"
ttdev = "0.2.1"
minecraft = "26.1.2"

[libraries]
jspecify = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }
annotations = { group = "org.jetbrains", name = "annotations", version.ref = "annotations" }
adventure-api = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
adventure-minimessage = { group = "net.kyori", name = "adventure-text-minimessage", version.ref = "adventure" }
adventure-platform-fabric = { group = "net.kyori", name = "adventure-platform-fabric", version.ref = "adventure-platform" }
adventure-platform-neoforge = { group = "net.kyori", name = "adventure-platform-neoforge", version.ref = "adventure-platform" }
paper-api = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }
velocity-api = { group = "com.velocitypowered", name = "velocity-api", version.ref = "velocity" }
packetevents-api = { group = "com.github.retrooper", name = "packetevents-api", version.ref = "packetevents" }
sponge-api = { group = "org.spongepowered", name = "spongeapi", version.ref = "sponge" }

[plugins]
indra = { id = "net.kyori.indra", version.ref = "indra" }
indra-licenser = { id = "net.kyori.indra.licenser.spotless", version.ref = "indra" }
indra-git = { id = "net.kyori.indra.git", version.ref = "indra" }
